[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qutes-lang"
version = "0.3.0.dev0"
description = "A strongly typed high-level quantum language that compiles to Qiskit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["antlr4-python3-runtime==4.13.2"]

[project.scripts]
qutes = "qutes.cli:main"

[project.optional-dependencies]
backend = ["numpy==2.1.3", "qiskit==2.3.0", "qiskit-aer==0.17.2"]
visualization = ["numpy==2.1.3", "qiskit==2.3.0", "matplotlib==3.10.0", "pylatexenc==2.10"]
dev = ["pytest==8.3.4", "numpy==2.1.3", "qiskit==2.3.0", "qiskit-aer==0.17.2", "matplotlib==3.10.0", "pylatexenc==2.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["backend: requires Qiskit and Aer; bounded backend feasibility tests"]
