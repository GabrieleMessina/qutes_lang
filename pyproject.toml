[build-system]
requires = ["setuptools==72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qutes-lang"
version = "0.1.0.dev0"
description = "Qutes language specification and compiler foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "numpy==2.1.3", "qiskit==2.3.0", "qiskit-aer==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = ["backend: requires Qiskit and Aer; bounded backend feasibility tests"]
