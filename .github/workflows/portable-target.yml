name: Build and test one portable target
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.9'
          enable-cache: false
      - name: Build from the checked out release revision on managed Python
        shell: bash
        run: |
          uv python install 3.12.16
          uv venv --managed-python --python 3.12.16 --seed .venv
          if [[ "$RUNNER_OS" == Windows ]]; then py=.venv/Scripts/python; else py=.venv/bin/python; fi
          "$py" tools/portable/build.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ inputs.target }}
          path: dist/qutes-2.0.1-${{ inputs.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify:
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: tools/portable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-${{ inputs.target }}
          path: archive
      - name: Run extracted executable in a clean project directory
        shell: bash
        run: python -I tools/portable/verify.py archive/qutes-2.0.1-${{ inputs.target }}.* --commit "$GITHUB_SHA"
