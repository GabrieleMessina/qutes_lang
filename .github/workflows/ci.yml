name: Compiler and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Isolate release dependencies from runner tools
        shell: bash
        run: |
          python -m venv .venv
          python -c "import os, pathlib; p = pathlib.Path('.venv', 'Scripts' if os.name == 'nt' else 'bin').resolve(); print(p, file=open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8'))"
      - name: Install pinned dependencies
        run: >-
          python -m pip install --only-binary=:all: --no-binary=pylatexenc -r requirements-dev.lock
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify generated ANTLR sources
        shell: bash
        run: |
          mkdir -p artifacts/antlr
          curl --fail --location https://www.antlr.org/download/antlr-4.13.2-complete.jar -o artifacts/antlr/antlr-4.13.2-complete.jar
          python tools/generate_parser.py --jar artifacts/antlr/antlr-4.13.2-complete.jar --check
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps . -w dist
      - name: Install wheel
        run: python -m pip install --no-deps dist/qutes_lang-2.0.1-py3-none-any.whl
      - name: Verify installed entry point and generated artifacts
        run: python -I tools/verify_install.py
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run semantic and integration tests
        run: python tools/check.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            artifacts/checks/*/results.xml
            artifacts/checks/*/environment.json
            artifacts/installation/*.json

  editor-version:
    name: Detect extension release
    if: github.ref == 'refs/heads/qutes2.0' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 qutes-vscode/marketplace.py plan "$BEFORE" >> "$GITHUB_OUTPUT"

  test-editor:
    name: Test native extension
    needs: editor-version
    if: needs.editor-version.outputs.mode != 'unchanged'
    uses: ./.github/workflows/editor-candidates.yml
    permissions:
      contents: read

  publish-editor:
    name: Publish tested VS Code packages
    needs: [validate, editor-version, test-editor]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vscode-extension
      url: https://marketplace.visualstudio.com/items?itemName=GabrieleMessina.qutes
    concurrency:
      group: marketplace-${{ needs.editor-version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --prefix qutes-vscode --ignore-scripts --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qutes-*
          path: tested
      - name: Check the publisher connection without uploading
        if: needs.editor-version.outputs.mode == 'check'
        working-directory: qutes-vscode
        run: |
          python3 marketplace.py verify ../tested
          node -e "require('@vscode/vsce/out/oidc').getOIDCCredential('GabrieleMessina').then(() => console.log('Marketplace authenticated this workflow.'))"
      - name: Upload the exact packages that passed
        if: needs.editor-version.outputs.mode == 'publish'
        run: python3 qutes-vscode/marketplace.py publish tested
