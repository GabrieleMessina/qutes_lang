name: Portable Qutes 2.0.1
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the verified archives to the release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/portable-target.yml
    with:
      runner: windows-2022
      target: windows-x64

  other-platforms:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
    uses: ./.github/workflows/portable-target.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}

  publish:
    needs: [windows, other-platforms]
    if: inputs.publish && github.repository == 'GabrieleMessina/qutes_lang' && github.ref == 'refs/heads/qutes2.0'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    concurrency: qutes-2-0-1-release-assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          merge-multiple: true
          path: artifacts/verified
      - name: Publish validated bytes and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/portable/publish.py artifacts/verified
