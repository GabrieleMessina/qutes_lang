name: Verify offline VS Code candidates
on:
  workflow_dispatch:
  push:
    branches: ['codex/verify-editor-*']
permissions:
  contents: read
jobs:
  packaged-editor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: win32-x64, archive: windows-x64.zip}
          - {runner: macos-15, target: darwin-arm64, archive: macos-arm64.zip}
          - {runner: macos-15-intel, target: darwin-x64, archive: macos-x64.zip}
          - {runner: ubuntu-22.04, target: linux-x64, archive: linux-x64.tar.gz}
          - {runner: ubuntu-22.04-arm, target: linux-arm64, archive: linux-arm64.tar.gz}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix qutes-vscode
      - run: python editors/generate.py --check
      - run: node --test editors/language.test.mjs qutes-vscode/tests/highlighting.cjs
      - name: Package and install the released runtime in a clean VS Code profile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          gh release download 2.0.1 --pattern "qutes-2.0.1-$ARCHIVE" --dir archives
          python qutes-vscode/package.py archives artifacts/editor-packages --target "$TARGET"
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" node qutes-vscode/tests/run-installed.cjs artifacts/editor-packages/*-"$TARGET".vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qutes-${{ matrix.target }}
          path: artifacts/editor-packages/*.vsix
          compression-level: 0
